<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Certificate — GreatPathshala</title>
<meta name="description" content="Look up your GreatPathshala webinar certificate using your email or phone number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --paper-dim:#F2EFE6;
    --ink:#14171F;
    --muted:#5B6472;
    --line:#E3DFD3;
    --brand:#0B3D45;
    --brand-2:#157A8C;
    --accent:#FF5A36;
    --white:#FFFFFF;
    --ok-bg:#EAF7EF; --ok-fg:#0F7A46; --ok-line:#BFE6CD;
    --bad-bg:#FDECEA; --bad-fg:#B3261E; --bad-line:#F4C7C2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1140px; margin:0 auto; padding:0 24px; width:100%}
  h1,h2{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em}
  .mono{font-family:'IBM Plex Mono',monospace}

  /* header */
  header{background:rgba(251,249,244,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  nav{display:flex; align-items:center; justify-content:space-between; min-height:72px}
  .brand{display:flex; align-items:center; gap:9px; font-family:'Fraunces',serif; font-weight:700; font-size:21px; color:var(--ink)}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(255,90,54,.16); animation:pulse 2.2s ease-in-out infinite}
  .brand b{color:var(--brand)}
  .nav-links{display:flex; align-items:center; gap:26px}
  .nav-links a:not(.btn){font-size:14px; font-weight:600; color:var(--muted); transition:color .15s ease}
  .nav-links a:not(.btn):hover{color:var(--brand)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:9px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px;
    padding:12px 20px; background:var(--brand); color:var(--white);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(11,61,69,.22)}
  .btn.accent{background:var(--accent)}
  .btn.accent:hover{box-shadow:0 10px 22px rgba(255,90,54,.28)}
  .btn:focus-visible, a:focus-visible, input:focus-visible, button:focus-visible{outline:3px solid var(--brand-2); outline-offset:2px}

  /* main */
  main{flex:1; display:flex; align-items:center; padding:56px 0}
  .panel-wrap{max-width:560px; margin:0 auto; width:100%}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brand-2); font-weight:600; display:flex; align-items:center; gap:8px; justify-content:center;
  }
  .eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 2.2s ease-in-out infinite}
  .head{text-align:center; margin-bottom:30px}
  .head h1{font-size:clamp(28px,4vw,36px); margin:14px 0 10px}
  .head p{color:var(--muted); font-size:15.5px}

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:20px;
    padding:34px 32px; box-shadow:0 24px 50px rgba(20,23,31,.07);
  }
  .field-label{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); display:block; margin-bottom:8px;
  }
  input{
    width:100%; padding:15px 16px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15.5px; font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{outline:none; border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(21,122,140,.14)}
  input::placeholder{color:#9BA3B0; font-family:'IBM Plex Mono',monospace; font-size:13.5px}
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; font-family:'IBM Plex Mono',monospace}
  button[type="submit"]{width:100%; margin-top:20px; font-size:15.5px; padding:15px 18px}

  .msg{
    margin-top:20px; padding:16px 18px; border-radius:12px; display:none;
    font-size:14.5px; border:1.5px solid transparent;
  }
  .msg.ok{background:var(--ok-bg); color:var(--ok-fg); border-color:var(--ok-line)}
  .msg.ok a{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    font-weight:700; color:var(--brand); border-bottom:1.5px solid currentColor;
  }
  .msg.bad{background:var(--bad-bg); color:var(--bad-fg); border-color:var(--bad-line)}

  .helper-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:22px;
    font-size:13.5px; color:var(--muted); flex-wrap:wrap; gap:10px;
  }
  .helper-row a{font-weight:700; color:var(--brand-2)}

  /* footer */
  footer{border-top:1px solid var(--line); background:var(--paper-dim); padding:22px 0}
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace}

  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none} }

  @media (max-width:640px){
    .card{padding:26px 22px}
    .nav-links a:not(.btn):not(.brand){display:none}
  }
</style>
</head>
<body>

  <header>
    <nav class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>Great<b>Pathshala</b></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a class="btn accent" href="register.html">Register — ₹29</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="wrap panel-wrap">
      <div class="head">
        <span class="eyebrow"><span class="dot"></span>Certificate lookup</span>
        <h1>Find your certificate</h1>
        <p>Enter the email address or phone number used at registration.</p>
      </div>

      <div class="card">
        <form id="lookupForm">
          <label class="field-label" for="query">Email or phone number</label>
          <input id="query" name="query" placeholder="email@example.com / 9876543210" required>
          <button class="btn accent" type="submit">Search certificate</button>
        </form>
        <div id="message" class="msg" role="status" aria-live="polite"></div>
      </div>

      <div class="helper-row">
        <span>Haven't registered yet?</span>
        <a href="register.html">Register for ₹29 →</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© 2026 GreatPathshala. All rights reserved.</span>
      <span>Payments secured by Razorpay</span>
    </div>
  </footer>

  <script>
    const form = document.getElementById('lookupForm');
    const message = document.getElementById('message');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.style.display = 'none';
      message.className = 'msg';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Searching…';

      const payload = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch('/api/certificate/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Certificate not found.');
        message.className = 'msg ok';
        message.innerHTML = `Certificate found for <b>${data.name}</b><br><a href="${data.certificateUrl}" target="_blank" rel="noopener">Open certificate →</a>`;
      } catch (error) {
        message.className = 'msg bad';
        message.textContent = error.message;
      } finally {
        message.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Search certificate';
      }
    });
  </script>
</body>
</html>
