<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreatPathshala Admin</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--n:#121a32;--p:#e92768;--l:#e5e7ef;--m:#697089;--bg:#f5f7fb;--ok:#07864d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--n);font:14px Inter,Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:20px}header{background:var(--n);color:white;position:sticky;top:0;z-index:4}header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}.auth,.toolbar,.filters,.grid{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin-top:16px}.tab{border:0;background:transparent;color:var(--m);padding:10px 12px;font-weight:700;cursor:pointer}.tab.active{background:var(--p);color:white;border-radius:8px}.panel{display:none}.panel.active{display:block}.field{display:grid;gap:5px;min-width:160px;flex:1}label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--m)}input,select,textarea{width:100%;border:1px solid #d9ddea;border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px}.btn{border:0;border-radius:8px;background:var(--p);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.dark{background:var(--n)}.btn.ok{background:var(--ok)}.btn:disabled{opacity:.5;cursor:not-allowed}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:16px;border-radius:12px;background:linear-gradient(135deg,#fff,#f4f6fb);border:1px solid var(--l)}.kpi b{font-size:28px;display:block;margin-top:5px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.chart{height:320px;min-height:0;position:relative}.chart canvas{max-height:280px!important;width:100%!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}table{border-collapse:collapse;width:100%;min-width:680px;font-size:12px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--l);vertical-align:top;overflow-wrap:anywhere}td:nth-child(7){max-width:170px;white-space:normal}td select{max-width:95px;padding:7px}th{font-size:10px;color:var(--m);text-transform:uppercase}.scroll{overflow:auto}.muted{color:var(--m)}.notice{min-height:20px;font-weight:700;margin:10px 0}.oktxt{color:var(--ok)}.bad{color:#bb2942}.datebar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.date-entry{display:flex;gap:8px;max-width:360px}.date-entry input{max-width:190px}.datebar button{border:1px solid var(--l);background:#fff;padding:8px;border-radius:7px;cursor:pointer}.datebar button.active{background:var(--n);color:white}.hide{display:none}@media(max-width:800px){.wrap{padding:14px}.kpis,.charts,.two{grid-template-columns:1fr}.auth{width:100%}header .wrap{align-items:flex-start;flex-direction:column}table{min-width:600px}td:nth-child(3),th:nth-child(3){display:none}}</style></head><body><header><div class="wrap"><h1>GreatPathshala Admin</h1><div class="auth"><input id="key" type="password" placeholder="Admin key"><button id="open" class="btn">Open dashboard</button><a class="btn dark" href="index.html">Website</a></div></div></header><main class="wrap"><p id="notice" class="notice"></p><div id="app" class="hide"><nav class="toolbar"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="sessions">Sessions</button><button class="tab" data-tab="students">Students & fees</button><button class="tab" data-tab="attendance">Attendance</button></nav><section id="overview" class="panel active"><div class="kpis"><div class="kpi">Online payments<b id="online">0</b></div><div class="kpi">UPI collected<b id="upi">0</b></div><div class="kpi">Cash collected<b id="cash">0</b></div><div class="kpi">Payment pending<b id="pending">0</b></div></div><div class="charts"><div class="card chart"><h2>Attendance — last 7 days</h2><canvas id="attendanceChart"></canvas></div><div class="card chart"><h2>Fee collection — monthly</h2><canvas id="feeChart"></canvas></div></div></section><section id="sessions" class="panel"><div class="card"><h2 id="formTitle">Create a session</h2><form id="sessionForm" class="two"><input id="editId" type="hidden"><div class="field"><label>Type</label><select id="type"><option value="webinar">Webinar</option><option value="class">Class</option><option value="post">Post</option></select></div><div class="field"><label>Subject</label><input id="subject" value="General"></div><div class="field full"><label>Title</label><input id="title" required></div><div class="field full"><label>Description</label><textarea id="excerpt"></textarea></div><div class="field"><label>Date & time</label><input id="scheduledAt" type="datetime-local"></div><div class="field"><label>Fee</label><input id="amount" type="number" min="1" value="29"></div><div class="field" id="feePlanField"><label>Class fee type</label><select id="feePlan"><option value="full">One-time full course fee</option><option value="monthly">Monthly fee</option></select></div><div class="field full"><label>Class schedule dates</label><div class="date-entry"><input id="classDatePicker" type="date"><button type="button" class="btn dark" id="classDateAdd">Add date</button></div><div id="classDateList" class="datebar"></div><input id="classDates" type="hidden"></div><div class="field full"><label>Meeting / download link</label><input id="link" type="url"></div><div class="toolbar full"><button class="btn">Save session</button><button type="button" class="btn dark" id="clear">Clear</button></div></form></div><div class="card"><h2>All content</h2><div id="contentList"></div></div></section><section id="students" class="panel"><div class="card"><div class="filters"><div class="field"><label>Search</label><input id="search" placeholder="Name, email, phone"></div><div class="field"><label>Session</label><select id="studentSession"><option value="">All sessions</option></select></div><div class="field"><label>Payment</label><select id="paymentFilter"><option value="">All payment status</option><option value="paid">Paid</option><option value="pending">Pending</option></select></div></div><div class="scroll"><table><thead><tr><th>Student</th><th>Session</th><th>Fee plan</th><th>Amount</th><th>Method</th><th>Payment</th><th>Attendance history</th><th>Certificate</th></tr></thead><tbody id="studentRows"></tbody></table></div></div></section><section id="attendance" class="panel"><div class="card"><div class="toolbar"><div class="field"><label>Webinar / class</label><select id="attendanceSession"></select></div><button id="loadAttendance" class="btn">Load attendance</button><div class="field" id="addDateBox"><label>Add missed class date</label><input id="newDate" type="date"></div><button id="addDate" class="btn dark">Add date</button></div><div id="datebar" class="datebar"></div><div class="toolbar"><button id="allPresent" class="btn ok">Mark all present</button><button id="allAbsent" class="btn dark">Mark all absent</button></div><div class="scroll"><table><thead><tr><th>Student</th><th>Payment</th><th>Present</th><th>Total / history</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></div></section></div></main><script>const $=x=>document.getElementById(x);let contents=[],students=[],attSession,attStudents=[],attDate='',charts=[];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t,b=false){$('notice').textContent=t;$('notice').className='notice '+(b?'bad':'oktxt')}async function api(url,o={}){o.headers={...(o.headers||{}),'x-admin-key':$('key').value};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(url,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const [c,s,a]=await Promise.all([api('/api/admin/content'),api('/api/admin/students'),api('/api/admin/analytics')]);contents=c.items;students=s.students;renderAll();renderAnalytics(a);$('app').classList.remove('hide')}function renderAll(){const sessions=contents.filter(x=>['class','webinar'].includes(x.type));const opts='<option value="">All sessions</option>'+sessions.map(x=>`<option value="${x.id}">${esc(x.type)}: ${esc(x.title)}</option>`).join('');$('studentSession').innerHTML=opts;$('attendanceSession').innerHTML=sessions.map(x=>`<option value="${x.id}">${esc(x.type)}: ${esc(x.title)}</option>`).join('');$('contentList').innerHTML=contents.map(x=>`<div class="card"><b>${esc(x.type)} · ${esc(x.title)}</b><span class="muted"> — ${esc(x.scheduledAt||'')}</span><button class="btn dark" onclick="edit('${x.id}')">Edit</button><button class="btn" onclick="del('${x.id}')">Delete</button></div>`).join('')||'<p class="muted">No content yet.</p>';renderStudents()}function renderAnalytics(a){$('online').textContent=a.payments.online;$('upi').textContent=a.payments.upi;$('cash').textContent=a.payments.cash;$('pending').textContent=a.payments.pending;charts.forEach(x=>x.destroy());charts=[new Chart($('attendanceChart'),{type:'bar',data:{labels:a.attendance.labels,datasets:[{label:'Students marked present',data:a.attendance.values,backgroundColor:'#e92768'}]},options:{responsive:true,maintainAspectRatio:false}}),new Chart($('feeChart'),{type:'line',data:{labels:a.collections.labels,datasets:[{label:'Collected',data:a.collections.values,borderColor:'#151633',backgroundColor:'#15163322',fill:true}]},options:{responsive:true,maintainAspectRatio:false}})]}function renderStudents(){const q=$('search').value.toLowerCase(),sid=$('studentSession').value,pay=$('paymentFilter').value;const list=students.filter(s=>(!q||[s.name,s.email,s.phone,s.webinarTitle].join(' ').toLowerCase().includes(q))&&(!sid||s.webinarId===sid)&&(!pay||s.paymentStatus===pay));$('studentRows').innerHTML=list.map(s=>{const history=Object.entries(s.attendance?.classDates||{}).filter(x=>x[1]).map(x=>x[0]).join(', ')||(s.attendance?.webinarPresent?'Webinar: Yes':'None');return `<tr><td><b>${esc(s.name)}</b><br>${esc(s.email)}</td><td>${esc(s.webinarTitle)}</td><td>${esc(s.feePlan||'full')}</td><td>₹${esc(s.amount)}</td><td><select onchange="method('${s.id}',this.value)"><option value="razorpay" ${s.paymentMethod==='razorpay'?'selected':''}>Razorpay</option><option value="upi" ${s.paymentMethod==='upi'?'selected':''}>UPI</option><option value="cash" ${s.paymentMethod==='cash'?'selected':''}>Cash</option></select></td><td><select onchange="payment('${s.id}',this.value)"><option value="pending" ${s.paymentStatus==='pending'?'selected':''}>Pending</option><option value="paid" ${s.paymentStatus==='paid'?'selected':''}>Paid</option></select></td><td>${esc(history)}</td><td>${s.certificateGenerated?`<a target="_blank" href="${s.certificateUrl}">Open</a>`:`<button class="btn" ${s.paymentStatus==='paid'?'':'disabled'} onclick="cert('${s.id}')">Generate</button>`}</td></tr>`}).join('')||'<tr><td colspan="8">No students found.</td></tr>'}window.payment=async(id,status)=>{await api('/api/admin/students/'+id+'/payment',{method:'PATCH',body:JSON.stringify({status})});await load()};window.method=async(id,paymentMethod)=>{const s=students.find(x=>x.id===id);await api('/api/admin/students/'+id+'/payment',{method:'PATCH',body:JSON.stringify({status:s.paymentStatus,paymentMethod})});await load()};window.cert=async id=>{const r=await api('/api/admin/generate-certificate/'+id,{method:'POST'});window.open(r.certificateUrl,'_blank');await load()};window.del=async id=>{if(confirm('Delete this content?')){await api('/api/admin/content/'+id,{method:'DELETE'});await load()}};window.edit=id=>{const x=contents.find(y=>y.id===id);$('editId').value=x.id;['type','subject','title','excerpt','scheduledAt','amount','feePlan','link'].forEach(k=>$(k).value=x[k]||'');$('classDates').value=(x.classDates||[]).join(', ');renderClassDates();$('formTitle').textContent='Edit '+x.title;location.hash='sessions'};$('sessionForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));['type','subject','title','excerpt','scheduledAt','amount','feePlan','link'].forEach(k=>data[k]=$(k).value);data.classDates=$('classDates').value;const id=$('editId').value;await api(id?'/api/admin/content/'+id:'/api/admin/content',{method:id?'PUT':'POST',body:JSON.stringify(data)});e.target.reset();$('editId').value='';await load()};function renderClassDates(){const dates=$('classDates').value.split(',').map(x=>x.trim()).filter(Boolean);$('classDateList').innerHTML=dates.map(d=>'<span class="date">'+d+'</span>').join('')};$('classDateAdd').onclick=()=>{const date=$('classDatePicker').value;if(!date)return;const dates=$('classDates').value.split(',').map(x=>x.trim()).filter(Boolean);if(!dates.includes(date))dates.push(date);$('classDates').value=dates.sort().join(', ');$('classDatePicker').value='';renderClassDates()};$('clear').onclick=()=>{$('sessionForm').reset();$('editId').value='';renderClassDates()};async function attendance(){const d=await api('/api/admin/attendance/'+$('attendanceSession').value);attSession=d.session;attStudents=d.students;if(attSession.type==='class'&&!attDate)attDate=attSession.classDates?.[0]||'';renderAttendance()}function renderAttendance(){const cls=attSession.type==='class';$('addDateBox').style.display=cls?'grid':'none';$('addDate').style.display=cls?'inline-block':'none';$('datebar').innerHTML=cls?attSession.classDates.map(d=>`<button class="${d===attDate?'active':''}" onclick="datePick('${d}')">${d}</button>`).join(''):'<span>One-time webinar attendance</span>';$('attendanceRows').innerHTML=attStudents.map(s=>{const p=cls?!!s.attendance?.classDates?.[attDate]:!!s.attendance?.webinarPresent;const hist=cls?Object.entries(s.attendance?.classDates||{}).filter(x=>x[1]).map(x=>x[0]).join(', ')||'None':p?'Present':'Absent';return `<tr><td>${esc(s.name)}<br><small>${esc(s.email)}</small></td><td>${esc(s.paymentStatus)}</td><td><input type="checkbox" ${p?'checked':''} ${s.paymentStatus==='paid'?'':'disabled'} onchange="mark('${s.id}',this.checked)"></td><td>${esc(hist)}</td></tr>`}).join('')}window.datePick=d=>{attDate=d;renderAttendance()};window.mark=async(id,p)=>{await api('/api/admin/attendance/'+id,{method:'PUT',body:JSON.stringify({present:p,date:attDate})});await attendance()};async function markAll(p){for(const s of attStudents.filter(x=>x.paymentStatus==='paid'))await api('/api/admin/attendance/'+s.id,{method:'PUT',body:JSON.stringify({present:p,date:attDate})});await attendance()}$('loadAttendance').onclick=attendance;$('allPresent').onclick=()=>markAll(true);$('allAbsent').onclick=()=>markAll(false);$('addDate').onclick=async()=>{await api('/api/admin/attendance/'+attSession.id+'/dates',{method:'PUT',body:JSON.stringify({date:$('newDate').value})});attDate=$('newDate').value;await attendance()};['search','studentSession','paymentFilter'].forEach(id=>$(id).oninput=renderStudents);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});$('open').onclick=async()=>{try{await load();note('Dashboard opened.')}catch(e){note(e.message,true)}};</script><script src="admin-offers.js"></script></body></html>
